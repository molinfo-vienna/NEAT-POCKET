[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neat-pc"
version = "1.0.0"
description = "Pocket-Conditioned 3D Molecular Generation with a Neighborhood-Guided, Efficient, Autoregressive Set Transformer"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT License"}
authors = [
    {name = "Daniel Rose", email = "daniel.rose@univie.ac.at"},
    {name = "Roxane Axel Jacob", email = "roxane.axel.jacob@univie.ac.at"},
]

dependencies = [
    "biopython==1.87",
    "biotite==1.6.0",
    "dask==2026.3.0",
    "distributed==2026.3.0",
    "e3nn==0.6.0",
    "gdown==6.0.0",
    "lightning==2.5.5",
    "matplotlib==3.10.9",
    "networkx==3.5",
    "numpy==1.26.4",
    "posebusters==0.6.5",
    "posecheck==1.3.1",
    "pyYAML==6.0.3",
    "py3dmol==2.5.3",
    "rdkit==2025.9.1",
    "scipy==1.16.2",
    "torch_geometric",  # version managed by torch
    "tqdm==4.67.1",
    "tensorboard===2.20.0",
    "seaborn==0.13.2",
    "setuptools==80.10.2",
]

[project.optional-dependencies]
vis = [
    "ipykernel==7.0.1",
    "ipython==9.6.0",
    "ipywidgets==8.1.7",
    "pillow==12.0.0",
]

[tool.setuptools]
packages = { find = { where = ["src"] } }